<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerador de QR Code do EduSync — crie QR Codes personalizados com cores, formas e logo para uso nas escolas do Paraná.">
    <title>EduSync — Gerador de QR Code</title>
    <link rel="icon" type="image/svg+xml" href="/shared/assets/favicon.svg">
    <script>
        /* ── Resolve o tema ANTES da primeira pintura para evitar flash claro
           ao chegar de uma página que esteja no escuro. As outras páginas do
           sistema usam `edugest_theme` (theme.js) — esse era o vazamento que
           fazia o gerador abrir sempre claro. Mantemos as chaves antigas
           (`aluno_tema` e `edusync_theme`) como fallback para sessões antigas
           e para alinhamento com o portal do aluno.                          */
        (function () {
            const t = localStorage.getItem('edugest_theme')
                   || localStorage.getItem('aluno_tema')
                   || localStorage.getItem('edusync_theme')
                   || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        /* Anti-flash: pinta o background com a cor certa do tema antes do CSS
           da página chegar, eliminando o "branco-escuro-cor" que causava o
           desgaste visual ao trocar de menu. */
        html[data-theme="dark"] { background: #0f172a; color-scheme: dark; }
        html:not([data-theme="dark"]) { background: #f8fafc; color-scheme: light; }
        body { margin: 0; }
    </style>
    <link rel="stylesheet" href="./qrcode.css?v=20260506b">
</head>
<body>

    <!-- HEADER -->
    <header class="qr-header">
        <div class="qr-header-inner">
            <a class="qr-logo" href="javascript:history.length>1?history.back():location.href='/'">
                <span class="qr-logo-icon">⚡</span>
                <span class="qr-logo-edu">Edu</span><span class="qr-logo-sync">Sync</span>
            </a>
            <div class="qr-header-title">
                <span class="qr-header-icon">◼</span>
                Gerador de QR Code
            </div>
            <div class="qr-header-actions">
                <button class="qr-tema-btn" id="qrTemaBtn" onclick="alternarTema()" title="Alternar tema">🌙</button>
                <a class="qr-voltar-btn" href="javascript:history.length>1?history.back():location.href='/'">← Voltar</a>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="qr-main">
        <div class="qr-card">

            <div class="qr-card-top">
                <h1 class="qr-titulo">◼ Gerador de QR Code</h1>
                <p class="qr-desc">Cole um link ou texto, escolha o estilo e gere o QR Code para impressão ou compartilhamento.</p>
            </div>

            <div class="qr-form">

                <!-- Link / texto -->
                <div class="qr-input-wrap">
                    <label class="qr-label" for="qrInput">Link ou texto</label>
                    <div class="qr-input-row">
                        <input type="text" id="qrInput" class="qr-input"
                               placeholder="https://exemplo.com/link-da-atividade"
                               autocomplete="off" spellcheck="false"
                               oninput="onInputChange()">
                        <button class="qr-btn-limpar" id="qrBtnLimpar" onclick="limpar()" title="Limpar" style="display:none">✕</button>
                    </div>
                </div>

                <div class="qr-opcoes">

                    <!-- Título para impressão -->
                    <div class="qr-opcao-group qr-opcao-group--full">
                        <label class="qr-label-sm" for="qrTitulo">Título para impressão <span class="qr-opt">(opcional)</span></label>
                        <input type="text" id="qrTitulo" class="qr-input-sm"
                               placeholder="Ex: Atividade de Matemática — 2º Ano"
                               maxlength="120">
                    </div>

                    <!-- Tamanho -->
                    <div class="qr-opcao-group">
                        <label class="qr-label-sm" for="qrTamanho">Tamanho</label>
                        <select id="qrTamanho" class="qr-select" onchange="reRender()">
                            <option value="160">Pequeno</option>
                            <option value="256" selected>Médio</option>
                            <option value="400">Grande</option>
                            <option value="512">Extra grande</option>
                        </select>
                    </div>

                    <!-- Nível de correção -->
                    <div class="qr-opcao-group">
                        <label class="qr-label-sm" for="qrCorrecao">Qualidade</label>
                        <select id="qrCorrecao" class="qr-select" onchange="gerarQR()">
                            <option value="L">Baixa (L)</option>
                            <option value="M" selected>Média (M)</option>
                            <option value="Q">Alta (Q)</option>
                            <option value="H">Máxima (H)</option>
                        </select>
                    </div>

                    <!-- Cor personalizada -->
                    <div class="qr-opcao-group">
                        <label class="qr-label-sm">Cor personalizada</label>
                        <div class="qr-cor-wrap">
                            <input type="color" id="qrCor" class="qr-cor-input" value="#000000" oninput="onCorPersonalizada()">
                            <span class="qr-cor-label" id="qrCorLabel">#000000</span>
                        </div>
                    </div>

                </div>

                <!-- ── Estilo dos pontos ── -->
                <div class="qr-secao">
                    <label class="qr-label-sm">Estilo dos pontos</label>
                    <div class="qr-estilos" id="qrEstilos">
                        <!-- Quadrado -->
                        <button class="qr-estilo-btn qr-estilo-btn--ativo" data-estilo="square" onclick="selecionarEstilo(this)" title="Quadrado">
                            <svg viewBox="0 0 36 36" width="36" height="36">
                                <rect x="2"  y="2"  width="9" height="9" fill="currentColor"/>
                                <rect x="14" y="2"  width="9" height="9" fill="currentColor"/>
                                <rect x="26" y="2"  width="9" height="9" fill="currentColor"/>
                                <rect x="2"  y="14" width="9" height="9" fill="currentColor"/>
                                <rect x="14" y="14" width="9" height="9" fill="currentColor"/>
                                <rect x="26" y="14" width="9" height="9" fill="currentColor"/>
                                <rect x="2"  y="26" width="9" height="9" fill="currentColor"/>
                                <rect x="14" y="26" width="9" height="9" fill="currentColor"/>
                                <rect x="26" y="26" width="9" height="9" fill="currentColor"/>
                            </svg>
                            <span>Quadrado</span>
                        </button>
                        <!-- Redondo -->
                        <button class="qr-estilo-btn" data-estilo="circle" onclick="selecionarEstilo(this)" title="Redondo">
                            <svg viewBox="0 0 36 36" width="36" height="36">
                                <circle cx="6.5"  cy="6.5"  r="4.5" fill="currentColor"/>
                                <circle cx="18"   cy="6.5"  r="4.5" fill="currentColor"/>
                                <circle cx="29.5" cy="6.5"  r="4.5" fill="currentColor"/>
                                <circle cx="6.5"  cy="18"   r="4.5" fill="currentColor"/>
                                <circle cx="18"   cy="18"   r="4.5" fill="currentColor"/>
                                <circle cx="29.5" cy="18"   r="4.5" fill="currentColor"/>
                                <circle cx="6.5"  cy="29.5" r="4.5" fill="currentColor"/>
                                <circle cx="18"   cy="29.5" r="4.5" fill="currentColor"/>
                                <circle cx="29.5" cy="29.5" r="4.5" fill="currentColor"/>
                            </svg>
                            <span>Redondo</span>
                        </button>
                        <!-- Arredondado -->
                        <button class="qr-estilo-btn" data-estilo="rounded" onclick="selecionarEstilo(this)" title="Arredondado">
                            <svg viewBox="0 0 36 36" width="36" height="36">
                                <rect x="2"  y="2"  width="9" height="9" rx="3" fill="currentColor"/>
                                <rect x="14" y="2"  width="9" height="9" rx="3" fill="currentColor"/>
                                <rect x="26" y="2"  width="9" height="9" rx="3" fill="currentColor"/>
                                <rect x="2"  y="14" width="9" height="9" rx="3" fill="currentColor"/>
                                <rect x="14" y="14" width="9" height="9" rx="3" fill="currentColor"/>
                                <rect x="26" y="14" width="9" height="9" rx="3" fill="currentColor"/>
                                <rect x="2"  y="26" width="9" height="9" rx="3" fill="currentColor"/>
                                <rect x="14" y="26" width="9" height="9" rx="3" fill="currentColor"/>
                                <rect x="26" y="26" width="9" height="9" rx="3" fill="currentColor"/>
                            </svg>
                            <span>Arredondado</span>
                        </button>
                        <!-- Diamante -->
                        <button class="qr-estilo-btn" data-estilo="diamond" onclick="selecionarEstilo(this)" title="Diamante">
                            <svg viewBox="0 0 36 36" width="36" height="36">
                                <polygon points="6.5,2 11,6.5 6.5,11 2,6.5"   fill="currentColor"/>
                                <polygon points="18,2 22.5,6.5 18,11 13.5,6.5" fill="currentColor"/>
                                <polygon points="29.5,2 34,6.5 29.5,11 25,6.5" fill="currentColor"/>
                                <polygon points="6.5,13.5 11,18 6.5,22.5 2,18"   fill="currentColor"/>
                                <polygon points="18,13.5 22.5,18 18,22.5 13.5,18" fill="currentColor"/>
                                <polygon points="29.5,13.5 34,18 29.5,22.5 25,18" fill="currentColor"/>
                                <polygon points="6.5,25 11,29.5 6.5,34 2,29.5"   fill="currentColor"/>
                                <polygon points="18,25 22.5,29.5 18,34 13.5,29.5" fill="currentColor"/>
                                <polygon points="29.5,25 34,29.5 29.5,34 25,29.5" fill="currentColor"/>
                            </svg>
                            <span>Diamante</span>
                        </button>
                        <!-- Estrela -->
                        <button class="qr-estilo-btn" data-estilo="star" onclick="selecionarEstilo(this)" title="Estrela">

                                <defs><path id="st" d="M0,-4.5 L1.05,-1.4 4.3,-1.4 1.75,0.55 2.7,3.6 0,1.75 -2.7,3.6 -1.75,0.55 -4.3,-1.4 -1.05,-1.4Z"/></defs>
                                <use href="#st" transform="translate(6,6.5)"   fill="currentColor"/>
                                <use href="#st" transform="translate(18,6.5)"  fill="currentColor"/>
                                <use href="#st" transform="translate(30,6.5)"  fill="currentColor"/>
                                <use href="#st" transform="translate(6,18)"    fill="currentColor"/>
                                <use href="#st" transform="translate(18,18)"   fill="currentColor"/>
                                <use href="#st" transform="translate(30,18)"   fill="currentColor"/>
                                <use href="#st" transform="translate(6,29.5)"  fill="currentColor"/>
                                <use href="#st" transform="translate(18,29.5)" fill="currentColor"/>
                                <use href="#st" transform="translate(30,29.5)" fill="currentColor"/>
                            </svg>
                            <span>Estrela</span>
                        </button>
                        <!-- Cruz -->
                        <button class="qr-estilo-btn" data-estilo="cross" onclick="selecionarEstilo(this)" title="Cruz">
                            <svg viewBox="0 0 36 36" width="36" height="36">
                                <defs><path id="cr" d="M-4,-1.3h8v2.6h-8zM-1.3,-4h2.6v8h-2.6z"/></defs>
                                <use href="#cr" transform="translate(6,6)"   fill="currentColor"/>
                                <use href="#cr" transform="translate(18,6)"  fill="currentColor"/>
                                <use href="#cr" transform="translate(30,6)"  fill="currentColor"/>
                                <use href="#cr" transform="translate(6,18)"  fill="currentColor"/>
                                <use href="#cr" transform="translate(18,18)" fill="currentColor"/>
                                <use href="#cr" transform="translate(30,18)" fill="currentColor"/>
                                <use href="#cr" transform="translate(6,30)"  fill="currentColor"/>
                                <use href="#cr" transform="translate(18,30)" fill="currentColor"/>
                                <use href="#cr" transform="translate(30,30)" fill="currentColor"/>
                            </svg>
                            <span>Cruz</span>
                        </button>
                        <!-- Hexágono -->
                        <button class="qr-estilo-btn" data-estilo="hexagon" onclick="selecionarEstilo(this)" title="Hexágono">
                            <svg viewBox="0 0 36 36" width="36" height="36">
                                <defs><polygon id="hx" points="4.5,0 2.25,-3.9 -2.25,-3.9 -4.5,0 -2.25,3.9 2.25,3.9"/></defs>
                                <use href="#hx" transform="translate(6,6.5)"   fill="currentColor"/>
                                <use href="#hx" transform="translate(18,6.5)"  fill="currentColor"/>
                                <use href="#hx" transform="translate(30,6.5)"  fill="currentColor"/>
                                <use href="#hx" transform="translate(6,18)"    fill="currentColor"/>
                                <use href="#hx" transform="translate(18,18)"   fill="currentColor"/>
                                <use href="#hx" transform="translate(30,18)"   fill="currentColor"/>
                                <use href="#hx" transform="translate(6,29.5)"  fill="currentColor"/>
                                <use href="#hx" transform="translate(18,29.5)" fill="currentColor"/>
                                <use href="#hx" transform="translate(30,29.5)" fill="currentColor"/>
                            </svg>
                            <span>Hexágono</span>
                        </button>
                        <!-- Folha -->
                        <button class="qr-estilo-btn" data-estilo="leaf" onclick="selecionarEstilo(this)" title="Folha">
                            <svg viewBox="0 0 36 36" width="36" height="36">
                                <defs><ellipse id="lf" cx="0" cy="0" rx="2.4" ry="4.4" transform="rotate(45)"/></defs>
                                <use href="#lf" transform="translate(6,6)"   fill="currentColor"/>
                                <use href="#lf" transform="translate(18,6)"  fill="currentColor"/>
                                <use href="#lf" transform="translate(30,6)"  fill="currentColor"/>
                                <use href="#lf" transform="translate(6,18)"  fill="currentColor"/>
                                <use href="#lf" transform="translate(18,18)" fill="currentColor"/>
                                <use href="#lf" transform="translate(30,18)" fill="currentColor"/>
                                <use href="#lf" transform="translate(6,30)"  fill="currentColor"/>
                                <use href="#lf" transform="translate(18,30)" fill="currentColor"/>
                                <use href="#lf" transform="translate(30,30)" fill="currentColor"/>
                            </svg>
                            <span>Folha</span>
                        </button>
                        <!-- Triângulo -->
                        <button class="qr-estilo-btn" data-estilo="triangle" onclick="selecionarEstilo(this)" title="Triângulo">
                            <svg viewBox="0 0 36 36" width="36" height="36">
                                <defs><polygon id="tr" points="0,-4.5 4,3.5 -4,3.5"/></defs>
                                <use href="#tr" transform="translate(6,6.5)"   fill="currentColor"/>
                                <use href="#tr" transform="translate(18,6.5)"  fill="currentColor"/>
                                <use href="#tr" transform="translate(30,6.5)"  fill="currentColor"/>
                                <use href="#tr" transform="translate(6,18)"    fill="currentColor"/>
                                <use href="#tr" transform="translate(18,18)"   fill="currentColor"/>
                                <use href="#tr" transform="translate(30,18)"   fill="currentColor"/>
                                <use href="#tr" transform="translate(6,29.5)"  fill="currentColor"/>
                                <use href="#tr" transform="translate(18,29.5)" fill="currentColor"/>
                                <use href="#tr" transform="translate(30,29.5)" fill="currentColor"/>
                            </svg>
                            <span>Triângulo</span>
                        </button>
                        <!-- Coração -->
                        <button class="qr-estilo-btn" data-estilo="heart" onclick="selecionarEstilo(this)" title="Coração">
                            <svg viewBox="0 0 36 36" width="36" height="36">
                                <defs><path id="ht" d="M0,-2 C0.1,-4 4.5,-4 4.5,-1.6 C4.5,0.5 2.25,2.3 0,4.1 C-2.25,2.3 -4.5,0.5 -4.5,-1.6 C-4.5,-4 -0.1,-4 0,-2Z"/></defs>
                                <use href="#ht" transform="translate(6,6)"   fill="currentColor"/>
                                <use href="#ht" transform="translate(18,6)"  fill="currentColor"/>
                                <use href="#ht" transform="translate(30,6)"  fill="currentColor"/>
                                <use href="#ht" transform="translate(6,18)"  fill="currentColor"/>
                                <use href="#ht" transform="translate(18,18)" fill="currentColor"/>
                                <use href="#ht" transform="translate(30,18)" fill="currentColor"/>
                                <use href="#ht" transform="translate(6,30)"  fill="currentColor"/>
                                <use href="#ht" transform="translate(18,30)" fill="currentColor"/>
                                <use href="#ht" transform="translate(30,30)" fill="currentColor"/>
                            </svg>
                            <span>Coração</span>
                        </button>
                        <!-- Pixel -->
                        <button class="qr-estilo-btn" data-estilo="pixel" onclick="selecionarEstilo(this)" title="Pixel">
                            <svg viewBox="0 0 36 36" width="36" height="36">
                                <defs><rect id="px" x="-3" y="-3" width="6" height="6"/></defs>
                                <use href="#px" transform="translate(6,6)"   fill="currentColor"/>
                                <use href="#px" transform="translate(18,6)"  fill="currentColor"/>
                                <use href="#px" transform="translate(30,6)"  fill="currentColor"/>
                                <use href="#px" transform="translate(6,18)"  fill="currentColor"/>
                                <use href="#px" transform="translate(18,18)" fill="currentColor"/>
                                <use href="#px" transform="translate(30,18)" fill="currentColor"/>
                                <use href="#px" transform="translate(6,30)"  fill="currentColor"/>
                                <use href="#px" transform="translate(18,30)" fill="currentColor"/>
                                <use href="#px" transform="translate(30,30)" fill="currentColor"/>
                            </svg>
                            <span>Pixel</span>
                        </button>
                    </div>
                </div>

                <!-- ── Tema de cores ── -->
                <div class="qr-secao">
                    <label class="qr-label-sm">Tema de cores</label>
                    <div class="qr-temas" id="qrTemas">
                        <button class="qr-tema-preset qr-tema-preset--ativo" data-dark="#000000" data-light="#ffffff" onclick="selecionarTema(this)" title="Clássico">
                            <span class="qr-tema-amostra" style="background:#000000;"></span>
                            <span>Clássico</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#6366f1" data-light="#ffffff" onclick="selecionarTema(this)" title="EduSync">
                            <span class="qr-tema-amostra" style="background:#6366f1;"></span>
                            <span>EduSync</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#1e40af" data-light="#eff6ff" onclick="selecionarTema(this)" title="Oceano">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#1e40af 50%,#eff6ff 50%);"></span>
                            <span>Oceano</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#166534" data-light="#f0fdf4" onclick="selecionarTema(this)" title="Floresta">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#166534 50%,#f0fdf4 50%);"></span>
                            <span>Floresta</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#b91c1c" data-light="#fff1f2" onclick="selecionarTema(this)" title="Rubi">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#b91c1c 50%,#fff1f2 50%);"></span>
                            <span>Rubi</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#f8fafc" data-light="#1e293b" onclick="selecionarTema(this)" title="Noite">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#1e293b 50%,#f8fafc 50%);"></span>
                            <span>Noite</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#92400e" data-light="#fffbeb" onclick="selecionarTema(this)" title="Âmbar">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#92400e 50%,#fffbeb 50%);"></span>
                            <span>Âmbar</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#7c3aed" data-light="#f5f3ff" onclick="selecionarTema(this)" title="Violeta">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#7c3aed 50%,#f5f3ff 50%);"></span>
                            <span>Violeta</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#be185d" data-light="#fdf2f8" onclick="selecionarTema(this)" title="Rosa">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#be185d 50%,#fdf2f8 50%);"></span>
                            <span>Rosa</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#c2410c" data-light="#fff7ed" onclick="selecionarTema(this)" title="Laranja">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#c2410c 50%,#fff7ed 50%);"></span>
                            <span>Laranja</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#0e7490" data-light="#ecfeff" onclick="selecionarTema(this)" title="Ciano">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#0e7490 50%,#ecfeff 50%);"></span>
                            <span>Ciano</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#a16207" data-light="#fefce8" onclick="selecionarTema(this)" title="Dourado">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#a16207 50%,#fefce8 50%);"></span>
                            <span>Dourado</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#0f766e" data-light="#f0fdfa" onclick="selecionarTema(this)" title="Petróleo">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#0f766e 50%,#f0fdfa 50%);"></span>
                            <span>Petróleo</span>
                        </button>
                        <button class="qr-tema-preset" data-dark="#475569" data-light="#f8fafc" onclick="selecionarTema(this)" title="Grafite">
                            <span class="qr-tema-amostra" style="background:linear-gradient(135deg,#475569 50%,#f8fafc 50%);"></span>
                            <span>Grafite</span>

                        </button>
                        <button class="qr-tema-preset" data-dark="#ffffff" data-light="#064e3b" onclick="selecionarTema(this)" title="Mata">

                <!-- ── Logo no centro ── -->
                <div class="qr-secao">
                    <label class="qr-label-sm">Logo no centro <span class="qr-opt">(opcional — recomenda-se qualidade Máxima)</span></label>
                    <div class="qr-logo-upload" id="qrLogoUpload">
                        <button class="qr-btn-logo-escolher" onclick="escolherLogo()">
                            <svg viewBox="0 0 20 20" fill="none" width="15" height="15">
                                <path d="M3 14l4-4 3 3 3-4 4 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.5"/>
                                <rect x="1" y="1" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
                            </svg>

                        </button>
                        <div class="qr-logo-info">
                            <span class="qr-logo-nome" id="qrLogoNome">Nenhuma imagem selecionada</span>
                            <button class="qr-btn-logo-remover" id="qrBtnRemoverLogo" onclick="removerLogo()" style="display:none">✕ Remover</button>
                        </div>
                        <div class="qr-logo-preview-wrap" id="qrLogoPreviewWrap" style="display:none">
                            <img id="qrLogoPreview" class="qr-logo-preview-img" alt="Preview da logo">
                        </div>
                        <input type="file" id="qrLogoInput" accept="image/*" style="display:none" onchange="logoEscolhida(this)">
                    </div>
                </div>

                <!-- Botão gerar -->
                <div class="qr-gerar-wrap">
                    <button class="qr-btn qr-btn--gerar" onclick="gerarQR()" id="qrBtnGerar">
                        <svg viewBox="0 0 20 20" fill="none" width="17" height="17">
                            <rect x="2" y="2" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.6"/>
                            <rect x="12" y="2" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.6"/>
                            <rect x="2" y="12" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.6"/>
                            <rect x="12" y="12" width="2" height="2" fill="currentColor"/>
                            <rect x="15" y="12" width="2" height="2" fill="currentColor"/>
                            <rect x="12" y="15" width="2" height="2" fill="currentColor"/>
                            <rect x="15" y="15" width="2" height="2" fill="currentColor"/>
                            <rect x="18" y="12" width="2" height="2" fill="currentColor"/>
                            <rect x="18" y="15" width="2" height="2" fill="currentColor"/>
                            <rect x="12" y="18" width="2" height="2" fill="currentColor"/>
                        </svg>
                        Gerar QR Code
                    </button>
                </div>
            </div>

            <!-- Prévia do QR Code -->
            <div class="qr-preview-area">
                <div class="qr-vazio" id="qrVazio">
                    <div class="qr-vazio-icon">◼</div>
                    <p class="qr-vazio-txt">Cole um link acima para gerar o QR Code</p>
                </div>
                <div class="qr-resultado" id="qrResultado" style="display:none">
                    <div class="qr-canvas-wrap" id="qrCanvasWrap">
                        <canvas id="qrCanvas"></canvas>
                    </div>
                    <div class="qr-url-preview" id="qrUrlPreview"></div>
                </div>
            </div>

            <!-- Ações -->
            <div class="qr-actions" id="qrActions" style="display:none">
                <button class="qr-btn qr-btn--primary" onclick="imprimir()">
                    <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
                        <path d="M5 7V3h10v4M5 15H3a1 1 0 01-1-1V8a1 1 0 011-1h14a1 1 0 011 1v6a1 1 0 01-1 1h-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        <rect x="5" y="11" width="10" height="6" rx="1" stroke="currentColor" stroke-width="1.6"/>
                    </svg>
                    Imprimir
                </button>
                <button class="qr-btn qr-btn--secondary" onclick="baixarPNG()">
                    <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
                        <path d="M10 3v10M6 9l4 4 4-4M4 17h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Baixar PNG
                </button>
                <button class="qr-btn qr-btn--ghost" onclick="copiarLink()">
                    <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
                        <rect x="7" y="7" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M13 7V5a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                    Copiar link
                </button>
            </div>

            <div class="qr-toast" id="qrToast"></div>

        </div>
    </main>

    <!-- ÁREA DE IMPRESSÃO -->
    <div class="qr-print-area" id="qrPrintArea">
        <div class="qr-print-logo">⚡ EduSync</div>
        <div class="qr-print-titulo" id="qrPrintTitulo"></div>
        <canvas id="qrPrintCanvas" style="display:block;margin:0 auto;"></canvas>
        <div class="qr-print-url" id="qrPrintUrl"></div>
        <div class="qr-print-rodape">Gerado em <span id="qrPrintData"></span> · EduSync</div>
    </div>

    <script src="./qrcode-page.js"></script>
</body>
</html>
