<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="../../shared/js/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="../../shared/assets/favicon.svg">
    <link rel="stylesheet" href="../../shared/css/theme.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <link rel="stylesheet" href="./analise-cola.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduSync — Analise de gabarito">
    <title>EduSync — Analise de gabarito</title>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <a href="/pages/dashboard/" class="logo-link" title="Início">
                    <span class="logo-icon">⚡</span>
                    <span class="logo-edu">Edu</span><span class="logo-sync">Sync</span>
                </a>
            </div>
            <div class="header-divider"></div>
            <nav class="nav-menu">
                <a href="/pages/dashboard/">Turmas</a>
                <a href="/pages/classroom/">Classroom</a>
                <a href="/pages/provas/">Provas</a>
                <a href="/pages/analise-cola/" class="active">🔍 Cola</a>
            </nav>
            <div class="header-actions">
                <div class="ac-notif-wrap" id="acNotifWrap">
                    <button class="ac-notif-bell" id="acNotifBell" onclick="toggleNotifPanel()" title="Alertas de gabarito" aria-label="Alertas de gabarito">
                        🔔
                        <span class="ac-notif-badge" id="acNotifBadge" style="display:none">0</span>
                    </button>
                    <div class="ac-notif-panel" id="acNotifPanel" style="display:none">
                        <div class="ac-notif-header">
                            <span>Alertas de gabarito</span>
                            <button class="ac-notif-lida-todas" id="acNotifLidaTodas" onclick="marcarTodasLidas()">Marcar todas como lidas</button>
                        </div>
                        <div id="acNotifLista" class="ac-notif-lista">
                            <div class="ac-notif-vazia">Nenhum alerta pendente.</div>
                        </div>
                    </div>
                </div>
                <button class="btn-theme" onclick="toggleTheme()">🌙</button>
                <button id="btnLogout" class="btn-logout">Sair</button>
            </div>
        </div>
    </header>

    <main class="ac-main">
        <div class="ac-toolbar">
            <h1>🔍 Analise de gabarito</h1>
            <div class="ac-toolbar-right">
                <select id="acTurma" onchange="onTurmaChange()">
                    <option value="">Selecione uma turma…</option>
                </select>
                <select id="acDisciplina" onchange="onCursoChange()" disabled>
                    <option value="">Selecione uma turma primeiro…</option>
                </select>
                <select id="acProva" onchange="onProvaChange()" disabled>
                    <option value="">Selecione uma prova…</option>
                </select>
            </div>
        </div>

        <div id="acPanel" class="ac-panel" style="display:none"></div>
        <div id="acEmpty" class="ac-empty">
            Selecione uma turma, disciplina e prova acima para ver a analise de gabarito.
        </div>
    </main>

    <!-- Modal Histórico Aluno -->
    <div id="acHistModal" class="ac-modal" style="display:none" onclick="if(event.target===this)fecharHistoricoModal()">
        <div class="ac-modal-card">
            <div class="ac-modal-header">
                <h3 id="acHistTitulo">Histórico de Cola</h3>
                <button class="ac-btn-icon" onclick="fecharHistoricoModal()">✕</button>
            </div>
            <div id="acHistCorpo" class="ac-hist-corpo"></div>
        </div>
    </div>

    <script src="../../shared/js/auth.js"></script>
    <script src="../../shared/js/modal-confirmar.js"></script>
    <script src="./analise-cola.js"></script>
</body>
</html>
