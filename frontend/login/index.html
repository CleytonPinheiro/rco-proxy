<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="../shared/js/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg">
    <link rel="stylesheet" href="../shared/css/theme.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSync — Entrar</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <span class="logo-icon">⚡</span>
            <div class="logo-text">
                <span class="logo-edu">Edu</span><span class="logo-sync">Sync</span>
            </div>
            <p class="login-subtitle">Sistema de Gestão Escolar</p>
        </div>

        <div class="login-card">
            <h2>Acesso ao sistema</h2>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="cpf">CPF (apenas números)</label>
                    <input type="text" id="cpf" name="cpf"
                           placeholder="00000000000"
                           maxlength="14"
                           autocomplete="username"
                           required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha RCO</label>
                    <input type="password" id="senha" name="senha"
                           autocomplete="current-password"
                           required>
                </div>
                <div class="form-aceite">
                    <input type="checkbox" id="aceiteTermos" name="aceiteTermos">
                    <label for="aceiteTermos">
                        Li e concordo com os
                        <a href="/termos/" target="_blank">Termos de Uso</a>
                        e a
                        <a href="/privacidade/" target="_blank">Política de Privacidade</a>,
                        incluindo o uso das minhas credenciais RCO para automação em meu nome.
                    </label>
                </div>

                <button type="submit" id="btnEntrar" class="btn-login" disabled>Entrar</button>
            </form>
            <div id="loginMsg" class="login-msg"></div>
        </div>

        <p class="login-footer">
            Autenticado via RCO Digital · Paraná ·
            <a href="/termos/" target="_blank">Termos</a> ·
            <a href="/privacidade/" target="_blank">Privacidade</a>
        </p>
    </div>

    <script src="./login.js"></script>
</body>
</html>
