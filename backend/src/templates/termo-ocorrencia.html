<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; background: #fff; font-family: Arial, Helvetica, sans-serif; }

  /* Cada .termo-page ocupa metade de um A4 (148mm × 210mm) */
  /* Dois termos por folha, empilhados verticalmente */
  .folha {
    width: 210mm;
    height: 297mm;
    display: flex;
    flex-direction: column;
    page-break-after: always;
    overflow: hidden;
  }
  .folha:last-child { page-break-after: avoid; }

  .termo-wrapper {
    width: 100%;
    height: 148mm;
    padding: 6mm 10mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .separador {
    width: 100%;
    height: 2mm;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .separador-linha {
    flex: 1;
    border-top: 1.2px dashed #bbb;
  }
  .separador-icone {
    font-size: 9pt;
    color: #aaa;
    flex-shrink: 0;
  }

  /* ── Cabeçalho ── */
  .cabecalho {
    display: flex;
    align-items: center;
    border: 1.5px solid #000;
    padding: 3px 6px;
    gap: 6px;
    margin-bottom: 4mm;
  }
  .cabecalho-logo {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cabecalho-logo img {
    max-width: 36px;
    max-height: 36px;
    object-fit: contain;
  }
  .cabecalho-logo-placeholder {
    width: 34px;
    height: 34px;
    border: 1px dashed #aaa;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5.5pt;
    color: #aaa;
    text-align: center;
  }
  .cabecalho-texto {
    flex: 1;
    text-align: center;
  }
  .cabecalho-escola {
    font-size: 9.5pt;
    font-weight: 700;
    line-height: 1.25;
  }
  .cabecalho-endereco {
    font-size: 7pt;
    color: #222;
    line-height: 1.4;
    margin-top: 1px;
  }

  /* ── Título ── */
  .titulo {
    text-align: center;
    font-size: 10.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 4mm;
  }

  /* ── Corpo ── */
  .corpo {
    flex: 1;
    display: flex;
    flex-direction: column;
    font-size: 8.5pt;
    line-height: 1;
  }

  .linha-frase {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 0px;
    margin-bottom: 3mm;
  }
  .linha-frase span { white-space: nowrap; }

  .campo {
    border-bottom: 1px solid #222;
    display: inline-block;
    min-height: 12px;
    padding: 0 2px 1px 2px;
    font-size: 8.5pt;
    font-weight: 700;
  }
  .campo-largo  { min-width: 80mm; flex: 1; }
  .campo-medio  { min-width: 45mm; }
  .campo-curto  { min-width: 20mm; }
  .campo-xm     { min-width: 28mm; }
  .campo-resto  { flex: 1; min-width: 30mm; }

  .frase-comportamento {
    margin-bottom: 2mm;
  }

  /* ── Linhas de descrição ── */
  .desc-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    margin-bottom: 2mm;
  }
  .desc-linha {
    border-bottom: 1px solid #aaa;
    min-height: 8mm;
  }
  .desc-preenchida {
    font-size: 8pt;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid #555;
    padding: 3px 5px;
    min-height: 20mm;
    flex: 1;
  }

  /* ── Data ── */
  .data-linha {
    text-align: right;
    margin-bottom: 3mm;
    font-size: 8.5pt;
  }

  /* ── Assinaturas ── */
  .assinaturas {
    display: flex;
    flex-direction: column;
    gap: 2.5mm;
    margin-bottom: 2.5mm;
  }
  .assinatura-item {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    font-size: 8.5pt;
  }
  .assinatura-item span { white-space: nowrap; }
  .assinatura-linha-campo {
    flex: 1;
    border-bottom: 1px solid #222;
    min-height: 11px;
  }

  /* ── Obs ── */
  .obs-bloco {
    display: flex;
    flex-direction: column;
    gap: 1mm;
  }
  .obs-linha-wrap {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    font-size: 8.5pt;
  }
  .obs-sublinha {
    flex: 1;
    border-bottom: 1px solid #aaa;
    min-height: 11px;
  }
</style>
</head>
<body>
{{FOLHAS}}
</body>
</html>
