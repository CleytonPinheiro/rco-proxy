<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; background: #fff; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 9.5pt; color: #111; }

  /* Uma página A4 por termo */
  .termo-page {
    width: 210mm;
    min-height: 297mm;
    max-height: 297mm;
    overflow: hidden;
    padding: 10mm 12mm 8mm 12mm;
    page-break-after: always;
    display: flex;
    flex-direction: column;
  }
  .termo-page:last-child { page-break-after: avoid; }

  .termo-wrapper {
    flex: 1;
    border: 2px solid #111;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Cabeçalho ── */
  .cabecalho {
    display: flex;
    align-items: center;
    border-bottom: 1.5px solid #111;
    padding: 5px 10px;
    gap: 8px;
  }
  .cabecalho-logo {
    flex-shrink: 0;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cabecalho-logo img {
    max-width: 50px;
    max-height: 50px;
    object-fit: contain;
  }
  .cabecalho-logo-placeholder {
    width: 46px;
    height: 46px;
    border: 1px dashed #aaa;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7pt;
    color: #aaa;
    text-align: center;
    line-height: 1.2;
  }
  .cabecalho-texto {
    flex: 1;
    text-align: center;
  }
  .cabecalho-orgao {
    font-size: 7.5pt;
    color: #444;
    margin-bottom: 2px;
  }
  .cabecalho-escola {
    font-size: 11pt;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .cabecalho-endereco {
    font-size: 7.5pt;
    color: #333;
  }

  /* ── Título ── */
  .titulo-bloco {
    border-bottom: 1px solid #111;
    padding: 5px 10px;
    text-align: center;
  }
  .titulo-principal {
    font-size: 11pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  /* ── Corpo ── */
  .corpo {
    flex: 1;
    padding: 10px 14px 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── Linhas de frase ── */
  .frase-linha {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    font-size: 9.5pt;
    line-height: 1.9;
    margin-bottom: 0;
    gap: 0;
  }
  .campo-inline {
    border-bottom: 1px solid #333;
    display: inline-block;
    padding: 0 3px 1px 3px;
    min-height: 15px;
    font-size: 9.5pt;
  }
  .campo-inline.largo  { min-width: 140px; flex: 1; max-width: 260px; }
  .campo-inline.medio  { min-width: 90px;  flex: 0.6; max-width: 160px; }
  .campo-inline.curto  { min-width: 45px;  flex: 0.3; max-width: 80px; }
  .campo-inline.destaque { font-weight: 700; }

  .frase-comportamento {
    font-size: 9.5pt;
    margin-top: 6px;
    margin-bottom: 6px;
    line-height: 1.5;
  }

  /* ── Área de descrição ── */
  .desc-linhas {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: 6px;
  }
  .desc-linha {
    border-bottom: 1px solid #aaa;
    min-height: 22px;
    width: 100%;
  }
  .desc-conteudo {
    font-size: 9pt;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid #555;
    padding: 5px 7px;
    flex: 1;
    min-height: 80px;
  }

  /* ── Data e tipo ── */
  .data-tipo-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    margin-top: 4px;
    justify-content: flex-end;
  }
  .categoria-texto {
    font-size: 8.5pt;
    color: #444;
  }
  .cidade-data {
    font-size: 9pt;
    text-align: right;
  }

  /* ── Assinaturas ── */
  .assinaturas {
    border-top: 1px solid #ccc;
    padding-top: 8px;
    display: flex;
    gap: 0;
    margin-bottom: 8px;
  }
  .assinatura-bloco {
    flex: 1;
    text-align: center;
    padding: 0 5px;
    border-right: 1px solid #ddd;
  }
  .assinatura-bloco:last-child { border-right: none; }
  .assinatura-linha {
    border-bottom: 1.5px solid #333;
    margin: 0 auto 4px auto;
    width: 90%;
    height: 30px;
  }
  .assinatura-label {
    font-size: 7.5pt;
    color: #444;
    font-weight: 600;
    line-height: 1.3;
  }

  /* ── Obs ── */
  .obs-bloco {
    margin-top: 4px;
    padding-top: 6px;
    border-top: 1px solid #ccc;
  }
  .obs-label {
    font-size: 9pt;
    font-weight: 700;
    margin-right: 4px;
  }
  .obs-linha {
    border-bottom: 1px solid #bbb;
    min-height: 18px;
    margin-bottom: 5px;
  }

  /* ── Badges de tipo ── */
  .tipo-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 8pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .3px;
    vertical-align: middle;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .tipo-grave    { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  .tipo-atencao  { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .tipo-positivo { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
</style>
</head>
<body>
{{OCORRENCIAS}}
</body>
</html>
