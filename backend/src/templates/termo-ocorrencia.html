<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; background: #fff; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 8pt; color: #111; }

  /* Uma página A4 paisagem por ocorrência — 2 cópias lado a lado */
  .termo-page {
    width: 297mm;
    height: 210mm;
    display: flex;
    flex-direction: row;
    page-break-after: always;
    overflow: hidden;
  }
  .termo-page:last-child { page-break-after: avoid; }

  /* Coluna de conteúdo (cada metade da folha) */
  .termo-coluna {
    width: calc((297mm - 7mm) / 2);
    height: 210mm;
    padding: 5mm 7mm 5mm 7mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Separador central com tesoura */
  .termo-separador {
    width: 7mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: stretch;
    padding: 4mm 0;
  }
  .termo-sep-linha {
    flex: 1;
    border-left: 1.5px dashed #bbb;
  }
  .termo-sep-icone {
    font-size: 11pt;
    color: #999;
    line-height: 1;
    transform: rotate(90deg);
    flex-shrink: 0;
    padding: 1mm 0;
  }

  .termo-wrapper {
    flex: 1;
    border: 1.5px solid #111;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Cabeçalho ── */
  .cabecalho {
    display: flex;
    align-items: center;
    border-bottom: 1.5px solid #111;
    padding: 3px 8px;
    gap: 6px;
  }
  .cabecalho-logo {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cabecalho-logo img {
    max-width: 38px;
    max-height: 38px;
    object-fit: contain;
  }
  .cabecalho-logo-placeholder {
    width: 36px;
    height: 36px;
    border: 1px dashed #aaa;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6pt;
    color: #aaa;
    text-align: center;
    line-height: 1.2;
  }
  .cabecalho-texto {
    flex: 1;
    text-align: center;
  }
  .cabecalho-orgao {
    font-size: 6.5pt;
    color: #444;
    margin-bottom: 1px;
  }
  .cabecalho-escola {
    font-size: 9pt;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 1.2;
    margin-bottom: 1px;
  }
  .cabecalho-endereco {
    font-size: 6.5pt;
    color: #333;
    line-height: 1.3;
  }

  /* ── Título ── */
  .titulo-bloco {
    border-bottom: 1px solid #111;
    padding: 4px 8px;
    text-align: center;
  }
  .titulo-principal {
    font-size: 9.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
  }

  /* ── Corpo ── */
  .corpo {
    flex: 1;
    padding: 7px 10px 5px 10px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── Linhas de frase ── */
  .frase-linha {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    font-size: 8pt;
    line-height: 1.8;
    gap: 0;
  }
  .campo-inline {
    border-bottom: 1px solid #333;
    display: inline-block;
    padding: 0 2px 1px 2px;
    min-height: 13px;
    font-size: 8pt;
  }
  .campo-inline.largo  { min-width: 100px; flex: 1; max-width: 200px; }
  .campo-inline.medio  { min-width: 70px;  flex: 0.5; max-width: 130px; }
  .campo-inline.curto  { min-width: 36px;  flex: 0.25; max-width: 65px; }
  .campo-inline.destaque { font-weight: 700; }

  .frase-comportamento {
    font-size: 8pt;
    margin-top: 4px;
    margin-bottom: 4px;
    line-height: 1.4;
  }

  /* ── Área de descrição ── */
  .desc-linhas {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: 4px;
  }
  .desc-linha {
    border-bottom: 1px solid #aaa;
    min-height: 18px;
    width: 100%;
  }
  .desc-conteudo {
    font-size: 8pt;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid #555;
    padding: 4px 6px;
    flex: 1;
    min-height: 60px;
  }

  /* ── Data e tipo ── */
  .data-tipo-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
    margin-top: 2px;
    justify-content: flex-end;
  }
  .categoria-texto {
    font-size: 7.5pt;
    color: #444;
  }
  .cidade-data {
    font-size: 8pt;
    text-align: right;
  }

  /* ── Assinaturas ── */
  .assinaturas {
    border-top: 1px solid #ccc;
    padding-top: 5px;
    display: flex;
    gap: 0;
    margin-bottom: 5px;
  }
  .assinatura-bloco {
    flex: 1;
    text-align: center;
    padding: 0 3px;
    border-right: 1px solid #ddd;
  }
  .assinatura-bloco:last-child { border-right: none; }
  .assinatura-linha {
    border-bottom: 1.5px solid #333;
    margin: 0 auto 3px auto;
    width: 90%;
    height: 22px;
  }
  .assinatura-label {
    font-size: 6.5pt;
    color: #444;
    font-weight: 600;
    line-height: 1.3;
  }

  /* ── Obs ── */
  .obs-bloco {
    margin-top: 2px;
    padding-top: 4px;
    border-top: 1px solid #ccc;
  }
  .obs-label {
    font-size: 8pt;
    font-weight: 700;
    margin-right: 3px;
  }
  .obs-linha {
    border-bottom: 1px solid #bbb;
    min-height: 15px;
    margin-bottom: 4px;
  }

  /* ── Badges de tipo ── */
  .tipo-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 7pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .3px;
    vertical-align: middle;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .tipo-grave    { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  .tipo-atencao  { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .tipo-positivo { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
</style>
</head>
<body>
{{OCORRENCIAS}}
</body>
</html>
