<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4 landscape; margin: 8mm 10mm 8mm 10mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 9.5pt; color: #111; background: #fff; }

  .page-pair {
    display: flex;
    gap: 6mm;
    page-break-after: always;
    height: calc(210mm - 16mm);
  }
  .page-pair:last-child { page-break-after: avoid; }

  .termo-wrapper {
    flex: 1;
    border: 2px solid #111;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .termo-vazio { flex: 1; }

  .page-pair .termo-wrapper:first-child {
    border-right: 1px solid #555;
  }

  /* ── Cabeçalho ── */
  .cabecalho {
    display: flex;
    align-items: center;
    border-bottom: 1.5px solid #111;
    padding: 5px 8px;
    gap: 8px;
  }
  .cabecalho-logo {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cabecalho-logo img {
    max-width: 46px;
    max-height: 46px;
    object-fit: contain;
  }
  .cabecalho-logo-placeholder {
    width: 42px;
    height: 42px;
    border: 1px dashed #aaa;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7pt;
    color: #aaa;
    text-align: center;
    line-height: 1.2;
  }
  .cabecalho-texto {
    flex: 1;
    text-align: center;
  }
  .cabecalho-orgao {
    font-size: 7pt;
    color: #444;
    margin-bottom: 1px;
  }
  .cabecalho-escola {
    font-size: 10pt;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .cabecalho-endereco {
    font-size: 7pt;
    color: #333;
  }

  /* ── Título ── */
  .titulo-bloco {
    border-bottom: 1px solid #111;
    padding: 4px 8px;
    text-align: center;
  }
  .titulo-principal {
    font-size: 10.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  /* ── Corpo ── */
  .corpo {
    flex: 1;
    padding: 8px 10px 5px 10px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── Linhas de frase (estilo formulário físico) ── */
  .frase-linha {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    font-size: 8.5pt;
    line-height: 1.7;
    margin-bottom: 2px;
    gap: 0;
  }

  .campo-inline {
    border-bottom: 1px solid #333;
    display: inline-block;
    padding: 0 3px 1px 3px;
    min-height: 14px;
    font-size: 8.5pt;
  }
  .campo-inline.largo  { min-width: 120px; flex: 1; max-width: 200px; }
  .campo-inline.medio  { min-width: 80px; flex: 0.6; max-width: 140px; }
  .campo-inline.curto  { min-width: 40px; flex: 0.3; max-width: 70px; }
  .campo-inline.destaque { font-weight: 700; }

  .frase-comportamento {
    font-size: 8.5pt;
    margin-top: 4px;
    margin-bottom: 4px;
    line-height: 1.5;
  }

  /* ── Linhas de descrição (manuscrito) ── */
  .desc-linhas {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: 4px;
  }
  .desc-linha {
    border-bottom: 1px solid #aaa;
    min-height: 18px;
    width: 100%;
  }
  .desc-conteudo {
    font-size: 8.5pt;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid #555;
    padding: 3px 5px;
    flex: 1;
    min-height: 60px;
  }

  /* ── Data e tipo ── */
  .data-tipo-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    margin-top: 2px;
    justify-content: flex-end;
  }
  .categoria-texto {
    font-size: 8pt;
    color: #444;
  }
  .cidade-data {
    font-size: 8.5pt;
    text-align: right;
  }

  /* ── Assinaturas ── */
  .assinaturas {
    border-top: 1px solid #ccc;
    padding-top: 6px;
    display: flex;
    gap: 0;
    margin-bottom: 5px;
  }
  .assinatura-bloco {
    flex: 1;
    text-align: center;
    padding: 0 3px;
    border-right: 1px solid #ddd;
  }
  .assinatura-bloco:last-child { border-right: none; }
  .assinatura-linha {
    border-bottom: 1.5px solid #333;
    margin: 0 auto 3px auto;
    width: 90%;
    height: 24px;
  }
  .assinatura-label {
    font-size: 7pt;
    color: #444;
    font-weight: 600;
    line-height: 1.2;
  }

  /* ── Obs ── */
  .obs-bloco {
    margin-top: 3px;
    padding-top: 4px;
    border-top: 1px solid #ccc;
  }
  .obs-label {
    font-size: 8.5pt;
    font-weight: 700;
    margin-right: 4px;
  }
  .obs-linha {
    border-bottom: 1px solid #bbb;
    min-height: 14px;
    margin-bottom: 3px;
  }

  /* ── Badges de tipo ── */
  .tipo-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 7.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .3px;
    vertical-align: middle;
  }
  .tipo-grave    { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  .tipo-atencao  { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .tipo-positivo { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
</style>
</head>
<body>
{{OCORRENCIAS}}
</body>
</html>
