<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4 landscape; margin: 8mm 10mm 8mm 10mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 9.5pt; color: #111; background: #fff; }

  .page-pair {
    display: flex;
    gap: 6mm;
    page-break-after: always;
    height: calc(210mm - 16mm); /* A4 height minus margins */
  }
  .page-pair:last-child { page-break-after: avoid; }

  .termo-wrapper {
    flex: 1;
    border: 2px solid #111;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .termo-vazio { flex: 1; }

  /* ── Divisória vertical central ── */
  .page-pair .termo-wrapper:first-child {
    border-right: 1px solid #555;
  }

  /* ── Cabeçalho ── */
  .cabecalho {
    display: flex;
    align-items: center;
    border-bottom: 1.5px solid #111;
    padding: 5px 8px;
    gap: 8px;
  }
  .cabecalho-logo {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cabecalho-logo img {
    max-width: 46px;
    max-height: 46px;
    object-fit: contain;
  }
  .cabecalho-logo-placeholder {
    width: 42px;
    height: 42px;
    border: 1px dashed #aaa;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7pt;
    color: #aaa;
    text-align: center;
    line-height: 1.2;
  }
  .cabecalho-texto {
    flex: 1;
    text-align: center;
  }
  .cabecalho-orgao {
    font-size: 7pt;
    color: #444;
    margin-bottom: 1px;
  }
  .cabecalho-escola {
    font-size: 10pt;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .cabecalho-endereco {
    font-size: 7pt;
    color: #333;
  }

  /* ── Título ── */
  .titulo-bloco {
    border-bottom: 1px solid #111;
    padding: 4px 8px;
    text-align: center;
  }
  .titulo-principal {
    font-size: 10pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  /* ── Corpo ── */
  .corpo {
    flex: 1;
    padding: 7px 8px 5px 8px;
    display: flex;
    flex-direction: column;
  }

  .campo-linha {
    display: flex;
    align-items: flex-end;
    margin-bottom: 7px;
    flex-wrap: wrap;
    gap: 2px 0;
  }
  .campo-label {
    font-size: 8.5pt;
    font-weight: 700;
    white-space: nowrap;
    margin-right: 3px;
    flex-shrink: 0;
  }
  .campo-valor {
    border-bottom: 1px solid #333;
    flex: 1;
    min-width: 50px;
    padding: 0 3px 1px 3px;
    font-size: 8.5pt;
    min-height: 15px;
  }
  .campo-sep {
    margin: 0 5px;
    font-weight: 700;
    flex-shrink: 0;
    font-size: 8.5pt;
  }

  /* Área de descrição */
  .desc-label {
    font-size: 8.5pt;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .desc-area {
    border: 1px solid #555;
    flex: 1;
    min-height: 38px;
    padding: 4px 6px;
    font-size: 8.5pt;
    line-height: 1.55;
    margin-bottom: 6px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Cidade e data */
  .cidade-data {
    text-align: right;
    font-size: 8.5pt;
    margin-bottom: 8px;
    margin-top: 2px;
  }

  /* Assinaturas */
  .assinaturas {
    border-top: 1px solid #ccc;
    padding-top: 6px;
    display: flex;
    gap: 0;
    margin-bottom: 5px;
  }
  .assinatura-bloco {
    flex: 1;
    text-align: center;
    padding: 0 4px;
    border-right: 1px solid #ddd;
  }
  .assinatura-bloco:last-child { border-right: none; }
  .assinatura-linha {
    border-bottom: 1.5px solid #333;
    margin: 0 auto 3px auto;
    width: 90%;
    height: 26px;
  }
  .assinatura-label {
    font-size: 7.5pt;
    color: #444;
    font-weight: 600;
  }

  /* Obs */
  .obs-bloco {
    margin-top: 2px;
    padding-top: 4px;
    border-top: 1px solid #ccc;
  }
  .obs-label {
    font-size: 8.5pt;
    font-weight: 700;
    margin-bottom: 1px;
    display: inline;
  }
  .obs-linha {
    border-bottom: 1px solid #bbb;
    min-height: 16px;
    margin-bottom: 4px;
  }

  /* Tipo badge */
  .tipo-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 7.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .3px;
    margin-left: 4px;
    vertical-align: middle;
  }
  .tipo-grave    { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  .tipo-atencao  { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .tipo-positivo { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
</style>
</head>
<body>
{{OCORRENCIAS}}
</body>
</html>
